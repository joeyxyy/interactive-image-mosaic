# Deploy the complete repository, including generated examples, screenshots, and report.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate final submission assets
        run: |
          pip install -r requirements.txt reportlab==4.4.9
          python scripts/generate_assets.py

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish Space
        env:
          HF_OIDC_RESOURCE: spaces/Joeyxyy/interactive-image-mosaic
        run: |
          hf upload Joeyxyy/interactive-image-mosaic . . \
            --type space \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --commit-message "Sync from GitHub"
